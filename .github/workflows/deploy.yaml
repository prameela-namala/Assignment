name: CI/CD - ECS Fargate with Terraform

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ENV_SUFFIX: dev
  IMAGE_TAG: ${{ github.sha }}

jobs:
  ci:
    # name: Lint & Test
    # runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || echo "No lint configured"

      - name: Test
        run: npm test || echo "No tests configured"

  deploy:
    name: Build, Push Image & Deploy to ECS
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR repository URI
        run: |
          REPO_NAME="webapp-${ENV_SUFFIX}"
          ECR_URI=$(aws ecr describe-repositories \
            --repository-names $REPO_NAME \
            --query "repositories[0].repositoryUri" \
            --output text)
          echo "ECR_URI=$ECR_URI" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker image
        run: |
          docker build -t webapp:${IMAGE_TAG} ./terraform-ecs-ecr-alb/frontend

      - name: Tag Docker image
        run: |
          docker tag webapp:${IMAGE_TAG} $ECR_URI:${IMAGE_TAG}

      - name: Push Docker image to ECR
        run: |
          docker push $ECR_URI:${IMAGE_TAG}

      - name: Deploy to ECS (force new deployment)
        run: |
          aws ecs update-service \
            --cluster ecs-cluster-dev \
            --service webapp-service-dev \
            --force-new-deployment \
            --region $AWS_REGION